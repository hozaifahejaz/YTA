name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test core modules
        run: swift test

  no-xcode-macros:
    name: No Xcode-only SwiftUI macros
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse @State, @Entry, @Animatable and #Preview
        # Their macro plugin ships only with Xcode. The owner's Mac has the Command Line Tools only.
        run: |
          if grep -rnE '^\s*@(State|Entry|Animatable|AnimatableIgnored)\b|#Preview\b' Sources; then
            echo "Use LocalState instead (Sources/DesignSystem/LocalState.swift)." >&2
            exit 1
          fi

  mcp-coverage:
    name: Every feature reachable through MCP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check AppModel methods against MCP actions
        run: python3 Scripts/check-control-coverage.py

  app-command-line-tools:
    name: Build with Command Line Tools only (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Switch to the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
          ls /Library/Developer/CommandLineTools/SDKs/
          swift --version
      - name: Build app bundle
        run: Scripts/build-app.sh

  app-macos:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: Scripts/build-app.sh
      - name: Check the bundle starts
        run: |
          build/YTA.app/Contents/MacOS/YTA &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "YTA is running"
            kill "$PID"
          else
            echo "YTA exited early" >&2
            exit 1
          fi
      - name: Lint
        run: swift format lint --recursive Sources Tests || true
      - name: Zip app
        run: ditto -c -k --keepParent build/YTA.app build/YTA.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: YTA
          path: build/YTA.zip
          retention-days: 14
